<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" fill="none">
  <defs>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="0.4" stop-color="#e0e7ff"/>
      <stop offset="0.7" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="sunDay" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.5" stop-color="#fde047"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="cloudDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f3e8ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="url(#skyDay)"/>

  <!-- Sun -->
  <circle cx="730" cy="60" r="40" fill="url(#sunDay)" opacity="0.8"/>
  <circle cx="730" cy="60" r="25" fill="#fef9c3" opacity="0.9"/>

  <!-- Sun rays -->
  <g opacity="0.3" stroke="#fde047" stroke-width="2" stroke-linecap="round">
    <line x1="730" y1="5" x2="730" y2="15"/>
    <line x1="780" y1="60" x2="790" y2="60"/>
    <line x1="680" y1="60" x2="670" y2="60"/>
    <line x1="770" y1="20" x2="763" y2="27"/>
    <line x1="690" y1="20" x2="697" y2="27"/>
    <line x1="770" y1="100" x2="763" y2="93"/>
    <line x1="690" y1="100" x2="697" y2="93"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.9">
    <ellipse cx="120" cy="55" rx="45" ry="22" fill="url(#cloudDay)"/>
    <ellipse cx="150" cy="50" rx="35" ry="20" fill="url(#cloudDay)"/>
    <ellipse cx="95" cy="60" rx="25" ry="15" fill="url(#cloudDay)"/>
  </g>

  <g opacity="0.7">
    <ellipse cx="380" cy="40" rx="35" ry="16" fill="url(#cloudDay)"/>
    <ellipse cx="405" cy="38" rx="28" ry="14" fill="url(#cloudDay)"/>
  </g>

  <g opacity="0.6">
    <ellipse cx="600" cy="110" rx="50" ry="20" fill="url(#cloudDay)"/>
    <ellipse cx="630" cy="105" rx="35" ry="16" fill="url(#cloudDay)"/>
    <ellipse cx="575" cy="115" rx="25" ry="12" fill="url(#cloudDay)"/>
  </g>

  <g opacity="0.5">
    <ellipse cx="250" cy="130" rx="40" ry="14" fill="url(#cloudDay)"/>
    <ellipse cx="275" cy="128" rx="30" ry="12" fill="url(#cloudDay)"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M 300 70 Q 305 65 310 70 Q 315 65 320 70"/>
    <path d="M 340 85 Q 344 81 348 85 Q 352 81 356 85"/>
    <path d="M 280 95 Q 283 92 286 95 Q 289 92 292 95"/>
  </g>

  <!-- Floating petals -->
  <ellipse cx="200" cy="100" rx="4" ry="7" fill="#e879f9" opacity="0.3" transform="rotate(30 200 100)"/>
  <ellipse cx="500" cy="80" rx="3" ry="6" fill="#a78bfa" opacity="0.25" transform="rotate(-45 500 80)"/>
  <ellipse cx="650" cy="140" rx="4" ry="7" fill="#f9a8d4" opacity="0.2" transform="rotate(60 650 140)"/>
  <ellipse cx="150" cy="160" rx="3" ry="5" fill="#818cf8" opacity="0.2" transform="rotate(-20 150 160)"/>
</svg>