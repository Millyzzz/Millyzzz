<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="bgNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.5" stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="vineNight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="petalAN" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#f5d0fe" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#e879f9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="petalBN" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="petalCN" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4338ca" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="petalDN" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fbcfe8" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#f9a8d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="centerAN" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="20" fill="url(#bgNight)"/>

  <!-- Glow circles -->
  <circle cx="150" cy="80" r="120" fill="#e879f9" opacity="0.08"/>
  <circle cx="750" cy="100" r="100" fill="#818cf8" opacity="0.08"/>
  <circle cx="450" cy="50" r="80" fill="#a78bfa" opacity="0.06"/>

  <!-- Stars -->
  <circle cx="120" cy="30" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="250" cy="20" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="380" cy="35" r="1.5" fill="#f5d0fe" opacity="0.7"/>
  <circle cx="500" cy="25" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="620" cy="40" r="2" fill="#c7d2fe" opacity="0.6"/>
  <circle cx="780" cy="30" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="840" cy="50" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="60" cy="50" r="1" fill="#f5d0fe" opacity="0.5"/>
  <circle cx="320" cy="15" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="560" cy="45" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="700" cy="20" r="0.8" fill="#e879f9" opacity="0.5"/>

  <!-- Twinkling stars (4-point) -->
  <g opacity="0.6">
    <path d="M 200 25 L 202 30 L 207 32 L 202 34 L 200 39 L 198 34 L 193 32 L 198 30 Z" fill="#f5d0fe"/>
    <path d="M 580 15 L 582 20 L 587 22 L 582 24 L 580 29 L 578 24 L 573 22 L 578 20 Z" fill="#c7d2fe"/>
  </g>

  <!-- Vine branches -->
  <path d="M 0 50 Q 80 40 120 60 Q 160 30 200 55 Q 240 75 280 45" stroke="url(#vineNight)" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 900 50 Q 820 40 780 60 Q 740 30 700 55 Q 660 75 620 45" stroke="url(#vineNight)" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 0 240 Q 60 220 100 235 Q 140 210 180 230" stroke="url(#vineNight)" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 900 240 Q 840 220 800 235 Q 760 210 720 230" stroke="url(#vineNight)" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Leaves -->
  <ellipse cx="70" cy="45" rx="10" ry="5" fill="#5b21b6" opacity="0.5" transform="rotate(-30 70 45)"/>
  <ellipse cx="190" cy="55" rx="8" ry="4" fill="#5b21b6" opacity="0.5" transform="rotate(25 190 55)"/>
  <ellipse cx="830" cy="45" rx="10" ry="5" fill="#5b21b6" opacity="0.5" transform="rotate(30 830 45)"/>
  <ellipse cx="710" cy="55" rx="8" ry="4" fill="#5b21b6" opacity="0.5" transform="rotate(-25 710 55)"/>

  <!-- ====== FLOWERS (glowing) ====== -->

  <!-- Flower 1: top-left, large, petalAN -->
  <g transform="translate(70 95)" filter="url(#glow)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)"/></g>
    <circle cx="0" cy="0" r="12" fill="url(#centerAN)"/>
    <circle cx="0" cy="0" r="6" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Flower 2: top-right, large, petalBN -->
  <g transform="translate(830 95)" filter="url(#glow)">
    <g transform="rotate(36)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)"/></g>
    <g transform="rotate(108)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)"/></g>
    <g transform="rotate(252)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)"/></g>
    <g transform="rotate(324)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)"/></g>
    <circle cx="0" cy="0" r="12" fill="url(#centerAN)"/>
    <circle cx="0" cy="0" r="6" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Flower 3: left, medium, petalCN -->
  <g transform="translate(40 190) scale(0.8)" filter="url(#glow)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalCN)"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalCN)"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalCN)"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalCN)"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalCN)"/></g>
    <circle cx="0" cy="0" r="11" fill="url(#centerAN)"/>
  </g>

  <!-- Flower 4: right, medium, petalDN -->
  <g transform="translate(860 185) scale(0.75)" filter="url(#glow)">
    <g transform="rotate(36)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalDN)"/></g>
    <g transform="rotate(108)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalDN)"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalDN)"/></g>
    <g transform="rotate(252)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalDN)"/></g>
    <g transform="rotate(324)"><ellipse cx="0" cy="-26" rx="14" ry="24" fill="url(#petalDN)"/></g>
    <circle cx="0" cy="0" r="11" fill="url(#centerAN)"/>
  </g>

  <!-- Small flowers -->
  <g transform="translate(200 55) scale(0.5)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)" opacity="0.8"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)" opacity="0.8"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)" opacity="0.8"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)" opacity="0.8"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalAN)" opacity="0.8"/></g>
    <circle cx="0" cy="0" r="12" fill="url(#centerAN)"/>
  </g>
  <g transform="translate(700 55) scale(0.5)">
    <g transform="rotate(36)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)" opacity="0.8"/></g>
    <g transform="rotate(108)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)" opacity="0.8"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)" opacity="0.8"/></g>
    <g transform="rotate(252)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)" opacity="0.8"/></g>
    <g transform="rotate(324)"><ellipse cx="0" cy="-26" rx="16" ry="26" fill="url(#petalBN)" opacity="0.8"/></g>
    <circle cx="0" cy="0" r="12" fill="url(#centerAN)"/>
  </g>

  <!-- Small buds (glowing) -->
  <circle cx="250" cy="200" r="8" fill="#e879f9" opacity="0.5"/>
  <circle cx="250" cy="200" r="4" fill="#f9a8d4" opacity="0.7"/>
  <circle cx="650" cy="205" r="7" fill="#818cf8" opacity="0.5"/>
  <circle cx="650" cy="205" r="3" fill="#a5b4fc" opacity="0.7"/>

  <!-- ====== TEXT (glowing) ====== -->
  <text x="450" y="125" text-anchor="middle" font-family="'Georgia','PingFang SC',serif" font-size="62" font-weight="700" fill="#f5d0fe" letter-spacing="2" filter="url(#glow)">Millyzzz</text>
  <text x="450" y="165" text-anchor="middle" font-family="'Georgia','PingFang SC',serif" font-size="17" fill="#c4b5fd" letter-spacing="3" opacity="0.8">✿ blooming into something beautiful ✿</text>

  <!-- Fireflies -->
  <circle cx="300" cy="130" r="3" fill="#fde047" opacity="0.6" filter="url(#glow)"/>
  <circle cx="600" cy="140" r="2.5" fill="#fde047" opacity="0.5" filter="url(#glow)"/>
  <circle cx="380" cy="180" r="2" fill="#a78bfa" opacity="0.6" filter="url(#glow)"/>
  <circle cx="550" cy="175" r="3" fill="#e879f9" opacity="0.5" filter="url(#glow)"/>
  <circle cx="100" cy="170" r="2" fill="#fde047" opacity="0.4" filter="url(#glow)"/>
  <circle cx="800" cy="165" r="2.5" fill="#818cf8" opacity="0.5" filter="url(#glow)"/>
</svg>