<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" role="img" aria-label="Millyzzz blooming banner — night">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petalGlowN" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="60%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="glowN" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="flowerN" viewBox="-50 -50 100 100">
      <g filter="url(#glowN)">
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGlowN)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGlowN)" transform="rotate(72)">
          <animateTransform attributeName="transform" type="rotate" from="72" to="432" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGlowN)" transform="rotate(144)">
          <animateTransform attributeName="transform" type="rotate" from="144" to="504" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGlowN)" transform="rotate(216)">
          <animateTransform attributeName="transform" type="rotate" from="216" to="576" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGlowN)" transform="rotate(288)">
          <animateTransform attributeName="transform" type="rotate" from="288" to="648" dur="20s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <circle r="9" fill="#fde047">
        <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#fde047;#fef08a;#fde047" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#fef9c3"/>
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1" dur="2.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1; 0.4 0 0.6 1" keyTimes="0;0.7;1"/>
    </symbol>
  </defs>

  <rect width="900" height="280" fill="url(#nightSky)"/>

  <!-- Twinkling stars -->
  <g fill="#fef9c3">
    <circle cx="80" cy="40" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="70" r="1">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="30" r="1.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="60" r="1">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="35" r="1.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="75" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100" r="0.8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="110" r="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moon with glow -->
  <circle cx="800" cy="60" r="30" fill="url(#moonGlow)"/>
  <circle cx="800" cy="60" r="22" fill="#fef9c3"/>
  <circle cx="790" cy="55" r="3" fill="#fde68a" opacity="0.6"/>
  <circle cx="810" cy="68" r="4" fill="#fde68a" opacity="0.6"/>

  <!-- Fireflies -->
  <g fill="#fde047">
    <circle r="2">
      <animate attributeName="cy" from="280" to="0" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;180;160;150" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.3;1;0" dur="9s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animate attributeName="cy" from="280" to="0" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="350;330;360;350" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.2;1;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animate attributeName="cy" from="280" to="0" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;620;610;600" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.3;1;0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <g transform="translate(450,140)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#f0abfc" filter="url(#glowN)">
      ✿ Millyzzz ✿
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text y="38" font-family="Georgia, serif" font-size="20" fill="#c4b5fd" font-style="italic">
      a garden in bloom
    </text>
  </g>

  <!-- Decorative glowing flowers -->
  <use href="#flowerN" x="80" y="80" width="60" height="60"/>
  <use href="#flowerN" x="760" y="80" width="60" height="60"/>
  <use href="#flowerN" x="40" y="200" width="50" height="50"/>
  <use href="#flowerN" x="810" y="200" width="50" height="50"/>

  <!-- Night vines -->
  <path d="M 0 270 Q 150 250 300 270 T 600 270 T 900 270" stroke="#4ade80" stroke-width="3" fill="none" opacity="0.5"/>
  <g fill="#86efac" opacity="0.85">
    <ellipse cx="150" cy="258" rx="8" ry="4" transform="rotate(-30 150 258)"/>
    <ellipse cx="450" cy="258" rx="8" ry="4" transform="rotate(-30 450 258)"/>
    <ellipse cx="750" cy="258" rx="8" ry="4" transform="rotate(-30 750 258)"/>
  </g>
</svg>
