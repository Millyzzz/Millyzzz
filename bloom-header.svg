<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" role="img" aria-label="Millyzzz blooming banner">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <!-- Petal gradient -->
    <radialGradient id="petalGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="60%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </radialGradient>
    <radialGradient id="petalGrad2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <!-- Soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Reusable flower symbol: 5 petals + center, with blooming animation -->
    <symbol id="flower" viewBox="-50 -50 100 100">
      <!-- Petals: 5 ellipses, each rotates and scales in -->
      <g>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGrad)" filter="url(#glow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGrad)" filter="url(#glow)" transform="rotate(72)">
          <animateTransform attributeName="transform" type="rotate" from="72" to="432" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGrad)" filter="url(#glow)" transform="rotate(144)">
          <animateTransform attributeName="transform" type="rotate" from="144" to="504" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGrad)" filter="url(#glow)" transform="rotate(216)">
          <animateTransform attributeName="transform" type="rotate" from="216" to="576" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="-22" rx="10" ry="18" fill="url(#petalGrad)" filter="url(#glow)" transform="rotate(288)">
          <animateTransform attributeName="transform" type="rotate" from="288" to="648" dur="20s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <!-- Center -->
      <circle r="8" fill="#fbbf24">
        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#fde68a"/>
      <!-- Bloom-in: starts as a bud, opens up -->
      <animateTransform attributeName="transform" type="scale" values="0.05;1.1;1" dur="2.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1; 0.4 0 0.6 1" keyTimes="0;0.7;1"/>
    </symbol>
  </defs>

  <!-- Background sky -->
  <rect width="900" height="280" fill="url(#skyGrad)"/>

  <!-- Soft drifting clouds (SMIL) -->
  <g opacity="0.7">
    <ellipse cx="120" cy="60" rx="50" ry="14" fill="#ffffff">
      <animate attributeName="cx" values="120;180;120" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="780" cy="50" rx="60" ry="16" fill="#ffffff">
      <animate attributeName="cx" values="780;720;780" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="30" rx="40" ry="10" fill="#ffffff">
      <animate attributeName="cx" values="450;510;450" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Falling petals (SMIL) -->
  <g opacity="0.85">
    <circle r="4" fill="#f9a8d4">
      <animate attributeName="cy" from="-20" to="280" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="100;120;110;100" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#c4b5fd">
      <animate attributeName="cy" from="-20" to="280" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="300;280;290;300" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#f9a8d4">
      <animate attributeName="cy" from="-20" to="280" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;620;610;600" dur="8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#c4b5fd">
      <animate attributeName="cy" from="-20" to="280" dur="6.5s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="800;780;790;800" dur="6.5s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Big title with breathing effect -->
  <g transform="translate(450,140)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#7c3aed" opacity="0.95">
      ✿ Millyzzz ✿
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text y="38" font-family="Georgia, serif" font-size="20" fill="#a78bfa" font-style="italic">
      a garden in bloom
    </text>
  </g>

  <!-- Decorative flowers on the left and right, each blooms in with delay -->
  <use href="#flower" x="80" y="80" width="60" height="60"/>
  <use href="#flower" x="760" y="80" width="60" height="60" transform="scale(1) translate(0,0)">
    <set attributeName="href" to="#flower"/>
  </use>
  <use href="#flower" x="40" y="200" width="50" height="50"/>
  <use href="#flower" x="810" y="200" width="50" height="50"/>

  <!-- Vines along the bottom -->
  <path d="M 0 270 Q 150 250 300 270 T 600 270 T 900 270" stroke="#86efac" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 0 270 Q 150 250 300 270 T 600 270 T 900 270" stroke="#86efac" stroke-width="3" fill="none" opacity="0.7" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Small leaves on the vine -->
  <g fill="#4ade80" opacity="0.85">
    <ellipse cx="150" cy="258" rx="8" ry="4" transform="rotate(-30 150 258)"/>
    <ellipse cx="450" cy="258" rx="8" ry="4" transform="rotate(-30 450 258)"/>
    <ellipse cx="750" cy="258" rx="8" ry="4" transform="rotate(-30 750 258)"/>
  </g>
</svg>
