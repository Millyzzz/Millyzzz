<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" role="img" aria-label="Hand-drawn night sky">
  <defs>
    <linearGradient id="nightSky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="ffSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>
    <filter id="nwWobble">
      <feTurbulence baseFrequency="0.04" numOctaves="2" seed="9" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <style><![CDATA[
    .nw-twinkle { animation: nwt 2s ease-in-out infinite; }
    .nw-twinkle.k1 { animation-delay: 0s; }
    .nw-twinkle.k2 { animation-delay: 0.3s; }
    .nw-twinkle.k3 { animation-delay: 0.6s; }
    .nw-twinkle.k4 { animation-delay: 0.9s; }
    .nw-twinkle.k5 { animation-delay: 1.2s; }
    @keyframes nwt {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.3; transform: scale(0.6); }
    }
    .nw-firefly { animation: nwfirefly 6s ease-in-out infinite; }
    .nwf1 { animation-delay: 0s; }
    .nwf2 { animation-delay: 1s; animation-duration: 7s; }
    .nwf3 { animation-delay: 2s; animation-duration: 8s; }
    @keyframes nwfirefly {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      50%      { transform: translate(15px, -10px); opacity: 1; }
    }
  ]]></style>

  <rect width="900" height="160" fill="url(#nightSky2)" />

  <!-- Twinkling stars -->
  <g fill="#fef9c3">
    <circle class="nw-twinkle k1" cx="80"  cy="30" r="2" />
    <circle class="nw-twinkle k2" cx="180" cy="50" r="1.5" />
    <circle class="nw-twinkle k3" cx="280" cy="25" r="2" />
    <circle class="nw-twinkle k4" cx="400" cy="40" r="1.5" />
    <circle class="nw-twinkle k5" cx="500" cy="30" r="2" />
    <circle class="nw-twinkle k1" cx="620" cy="55" r="1.5" />
    <circle class="nw-twinkle k2" cx="720" cy="40" r="2" />
    <circle class="nw-twinkle k3" cx="840" cy="60" r="1.5" />
    <circle class="nw-twinkle k4" cx="50"  cy="75" r="1.2" />
    <circle class="nw-twinkle k5" cx="380" cy="60" r="1.5" />
    <!-- Big sparkle stars -->
    <g class="nw-twinkle k2" transform="translate(130, 50)">
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#fef9c3" stroke-width="1.2" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#fef9c3" stroke-width="1.2" />
    </g>
    <g class="nw-twinkle k4" transform="translate(580, 35)">
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#fef9c3" stroke-width="1.2" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#fef9c3" stroke-width="1.2" />
    </g>
  </g>

  <!-- Crescent moon -->
  <g transform="translate(820, 40)">
    <circle r="22" fill="#fef9c3" filter="url(#nwWobble)" />
    <circle cx="6" cy="-2" r="20" fill="url(#nightSky2)" />
  </g>

  <!-- Dim clouds (purple) -->
  <g filter="url(#nwWobble)">
    <path d="M 100,80 Q 80,65 130,68 Q 160,55 195,72 Q 225,85 195,90 Q 150,95 110,85 Z" fill="#6366f1" opacity="0.4" />
    <path d="M 380,90 Q 360,75 410,78 Q 450,68 490,85 Q 520,98 470,102 Q 410,105 380,95 Z" fill="#6366f1" opacity="0.35" />
  </g>

  <!-- Fireflies -->
  <g>
    <g class="nw-firefly nwf1" transform="translate(140, 90)">
      <circle r="9" fill="url(#ffSky)" />
      <circle r="2" fill="#fff" />
    </g>
    <g class="nw-firefly nwf2" transform="translate(380, 110)">
      <circle r="9" fill="url(#ffSky)" />
      <circle r="2" fill="#fff" />
    </g>
    <g class="nw-firefly nwf3" transform="translate(620, 100)">
      <circle r="9" fill="url(#ffSky)" />
      <circle r="2" fill="#fff" />
    </g>
  </g>

  <!-- Wavy underline -->
  <path d="M 50,130 Q 150,120 250,130 T 450,130 T 650,130 T 850,130" stroke="#a5b4fc" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>
