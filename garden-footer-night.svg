<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none">
  <defs>
    <linearGradient id="grassNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2e05"/>
      <stop offset="0.3" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="skyFooterNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a2e"/>
      <stop offset="0.5" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0d0221"/>
    </linearGradient>
    <radialGradient id="petalFN1" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#f5d0fe" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#e879f9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="petalFN2" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="petalFN3" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fbcfe8" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#f9a8d4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="centerFN" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="catBodyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="nightGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="200" fill="url(#skyFooterNight)"/>

  <!-- Stars -->
  <circle cx="80" cy="15" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="25" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="15" r="1.5" fill="#f5d0fe" opacity="0.6"/>
  <circle cx="500" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="680" cy="20" r="1.5" fill="#c7d2fe" opacity="0.6"/>
  <circle cx="820" cy="25" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="150" cy="50" r="1" fill="#f5d0fe" opacity="0.4"/>
  <circle cx="580" cy="45" r="1" fill="#fff" opacity="0.3"/>

  <!-- Moon in corner -->
  <circle cx="850" cy="30" r="22" fill="#fef9c3" opacity="0.15" filter="url(#nightGlow)"/>
  <circle cx="850" cy="30" r="12" fill="#fef9c3" opacity="0.4" filter="url(#nightGlow)"/>

  <!-- Grass (dark rolling hills) -->
  <path d="M 0 120 Q 100 100 200 115 Q 300 95 400 110 Q 500 90 600 105 Q 700 100 800 115 Q 850 120 900 110 L 900 200 L 0 200 Z" fill="url(#grassNight)"/>

  <!-- Grass blades (dark) -->
  <g stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M 50 130 L 48 122"/>
    <path d="M 55 128 L 53 120"/>
    <path d="M 120 125 L 118 117"/>
    <path d="M 300 120 L 298 112"/>
    <path d="M 500 115 L 498 107"/>
    <path d="M 700 118 L 698 110"/>
    <path d="M 850 125 L 848 117"/>
  </g>

  <!-- Fence (dark) -->
  <g opacity="0.4">
    <rect x="100" y="95" width="6" height="35" rx="3" fill="#312e81"/>
    <rect x="115" y="92" width="6" height="38" rx="3" fill="#312e81"/>
    <rect x="130" y="95" width="6" height="35" rx="3" fill="#312e81"/>
    <rect x="760" y="92" width="6" height="38" rx="3" fill="#312e81"/>
    <rect x="775" y="95" width="6" height="35" rx="3" fill="#312e81"/>
    <rect x="790" y="92" width="6" height="38" rx="3" fill="#312e81"/>
    <path d="M 98 95 L 103 90 L 108 95" fill="#312e81"/>
    <path d="M 113 92 L 118 87 L 123 92" fill="#312e81"/>
    <path d="M 128 95 L 133 90 L 138 95" fill="#312e81"/>
    <path d="M 758 92 L 763 87 L 768 92" fill="#312e81"/>
    <path d="M 773 95 L 778 90 L 783 95" fill="#312e81"/>
    <path d="M 788 92 L 793 87 L 798 92" fill="#312e81"/>
  </g>

  <!-- ====== FLOWERS (glowing) ====== -->
  <g transform="translate(80 140) scale(0.65)" filter="url(#nightGlow)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)"/></g>
    <circle cx="0" cy="0" r="10" fill="url(#centerFN)"/>
    <line x1="0" y1="10" x2="0" y2="40" stroke="#4c1d95" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g transform="translate(250 145) scale(0.55)" filter="url(#nightGlow)">
    <g transform="rotate(36)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN2)"/></g>
    <g transform="rotate(108)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN2)"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN2)"/></g>
    <g transform="rotate(252)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN2)"/></g>
    <g transform="rotate(324)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN2)"/></g>
    <circle cx="0" cy="0" r="10" fill="url(#centerFN)"/>
    <line x1="0" y1="10" x2="0" y2="50" stroke="#4c1d95" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g transform="translate(650 142) scale(0.6)" filter="url(#nightGlow)">
    <g transform="rotate(0)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN3)"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN3)"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN3)"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN3)"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN3)"/></g>
    <circle cx="0" cy="0" r="10" fill="url(#centerFN)"/>
    <line x1="0" y1="10" x2="0" y2="45" stroke="#4c1d95" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g transform="translate(820 148) scale(0.5)" filter="url(#nightGlow)">
    <g transform="rotate(36)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)" opacity="0.8"/></g>
    <g transform="rotate(108)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)" opacity="0.8"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)" opacity="0.8"/></g>
    <g transform="rotate(252)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)" opacity="0.8"/></g>
    <g transform="rotate(324)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalFN1)" opacity="0.8"/></g>
    <circle cx="0" cy="0" r="10" fill="url(#centerFN)"/>
    <line x1="0" y1="10" x2="0" y2="45" stroke="#4c1d95" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Glowing buds -->
  <circle cx="180" cy="155" r="6" fill="#e879f9" opacity="0.4" filter="url(#nightGlow)"/>
  <circle cx="400" cy="150" r="5" fill="#a78bfa" opacity="0.4" filter="url(#nightGlow)"/>
  <circle cx="550" cy="152" r="6" fill="#f9a8d4" opacity="0.4" filter="url(#nightGlow)"/>
  <circle cx="720" cy="158" r="5" fill="#818cf8" opacity="0.4" filter="url(#nightGlow)"/>

  <!-- ====== CAT (dark silhouette with glowing eyes) ====== -->
  <g transform="translate(420 110)">
    <!-- Tail -->
    <path d="M 45 30 Q 60 20 65 5 Q 67 -5 60 -8" stroke="url(#catBodyNight)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="25" cy="35" rx="30" ry="22" fill="url(#catBodyNight)"/>
    <!-- Head -->
    <circle cx="25" cy="15" r="20" fill="url(#catBodyNight)"/>
    <!-- Ears -->
    <path d="M 10 5 L 8 -8 L 18 0 Z" fill="#5b21b6"/>
    <path d="M 40 5 L 42 -8 L 32 0 Z" fill="#5b21b6"/>
    <!-- Glowing eyes -->
    <circle cx="19" cy="13" r="3.5" fill="#fde047" opacity="0.8" filter="url(#nightGlow)"/>
    <circle cx="31" cy="13" r="3.5" fill="#fde047" opacity="0.8" filter="url(#nightGlow)"/>
    <ellipse cx="19" cy="13" rx="1.5" ry="3" fill="#1a1a2e"/>
    <ellipse cx="31" cy="13" rx="1.5" ry="3" fill="#1a1a2e"/>
    <!-- Nose -->
    <path d="M 23 19 L 25 21 L 27 19 Z" fill="#f472b6" opacity="0.6"/>
    <!-- Paws -->
    <ellipse cx="10" cy="55" rx="8" ry="5" fill="#5b21b6"/>
    <ellipse cx="40" cy="55" rx="8" ry="5" fill="#5b21b6"/>
  </g>

  <!-- Fireflies around garden -->
  <circle cx="350" cy="90" r="2.5" fill="#fde047" opacity="0.6" filter="url(#nightGlow)"/>
  <circle cx="550" cy="85" r="2" fill="#a78bfa" opacity="0.5" filter="url(#nightGlow)"/>
  <circle cx="200" cy="100" r="2" fill="#fde047" opacity="0.5" filter="url(#nightGlow)"/>
  <circle cx="700" cy="95" r="2.5" fill="#e879f9" opacity="0.5" filter="url(#nightGlow)"/>
  <circle cx="100" cy="105" r="1.5" fill="#fde047" opacity="0.4" filter="url(#nightGlow)"/>
  <circle cx="800" cy="100" r="2" fill="#818cf8" opacity="0.5" filter="url(#nightGlow)"/>
  <circle cx="480" cy="130" r="1.5" fill="#fde047" opacity="0.4" filter="url(#nightGlow)"/>
  <circle cx="600" cy="135" r="1.5" fill="#c4b5fd" opacity="0.4" filter="url(#nightGlow)"/>
</svg>