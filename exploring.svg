<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none">
  <defs>
    <linearGradient id="exploreBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#fce7f3" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="seedGrad" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#65a30d"/>
    </radialGradient>
    <linearGradient id="sproutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c5d6"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <radialGradient id="petalExp" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fce4ff"/>
      <stop offset="0.7" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#c026d3"/>
    </radialGradient>
    <radialGradient id="centerExp" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#eab308"/>
    </radialGradient>
  </defs>

  <!-- Background card -->
  <rect x="20" y="20" width="860" height="160" rx="20" fill="url(#exploreBg)" stroke="#e879f9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Seed (left) -->
  <g transform="translate(100 100)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="url(#seedGrad)" opacity="0.8"/>
    <path d="M -8 5 Q 0 -5 8 5" stroke="#65a30d" stroke-width="1.5" fill="none" opacity="0.5"/>
    <text x="0" y="45" text-anchor="middle" font-family="'Georgia',serif" font-size="13" fill="#65a30d" opacity="0.7">🌱 seed</text>
  </g>

  <!-- Sprout (center-left) -->
  <g transform="translate(250 100)">
    <line x1="0" y1="20" x2="0" y2="-10" stroke="url(#sproutGrad)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-8" cy="0" rx="10" ry="6" fill="#86c5d6" opacity="0.8" transform="rotate(-30 -8 0)"/>
    <ellipse cx="8" cy="-5" rx="10" ry="6" fill="#86c5d6" opacity="0.8" transform="rotate(30 8 -5)"/>
    <text x="0" y="45" text-anchor="middle" font-family="'Georgia',serif" font-size="13" fill="#65a30d" opacity="0.7">🌿 sprout</text>
  </g>

  <!-- Half-bloom (center) -->
  <g transform="translate(400 100) scale(0.7)">
    <line x1="0" y1="25" x2="0" y2="-5" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="5" rx="12" ry="7" fill="#86c5d6" opacity="0.7" transform="rotate(-25 -10 5)"/>
    <ellipse cx="10" cy="0" rx="12" ry="7" fill="#86c5d6" opacity="0.7" transform="rotate(25 10 0)"/>
    <g transform="rotate(0)"><ellipse cx="0" cy="-15" rx="10" ry="15" fill="url(#petalExp)" opacity="0.7"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-15" rx="10" ry="15" fill="url(#petalExp)" opacity="0.7"/></g>
    <circle cx="0" cy="0" r="6" fill="url(#centerExp)"/>
    <text x="0" y="55" text-anchor="middle" font-family="'Georgia',serif" font-size="18" fill="#65a30d" opacity="0.7" transform="scale(1.43)">🌷 growing</text>
  </g>

  <!-- Full bloom (center-right) -->
  <g transform="translate(580 100) scale(0.8)">
    <line x1="0" y1="30" x2="0" y2="0" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <g transform="rotate(0)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalExp)" opacity="0.9"/></g>
    <g transform="rotate(72)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalExp)" opacity="0.9"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalExp)" opacity="0.9"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalExp)" opacity="0.9"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-22" rx="14" ry="22" fill="url(#petalExp)" opacity="0.9"/></g>
    <circle cx="0" cy="0" r="10" fill="url(#centerExp)"/>
    <text x="0" y="55" text-anchor="middle" font-family="'Georgia',serif" font-size="16" fill="#65a30d" opacity="0.7" transform="scale(1.25)">🌸 blooming</text>
  </g>

  <!-- Arrow / journey line -->
  <path d="M 120 100 Q 200 90 250 100 Q 350 110 400 100 Q 500 90 580 100" stroke="#e879f9" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.4"/>

  <!-- Question marks (exploring) -->
  <g transform="translate(720 100)">
    <text x="0" y="0" text-anchor="middle" font-family="'Georgia',serif" font-size="36" fill="#a78bfa" opacity="0.6">?</text>
    <text x="25" y="-15" text-anchor="middle" font-family="'Georgia',serif" font-size="24" fill="#e879f9" opacity="0.5">?</text>
    <text x="-25" y="-10" text-anchor="middle" font-family="'Georgia',serif" font-size="28" fill="#818cf8" opacity="0.5">?</text>
    <text x="0" y="45" text-anchor="middle" font-family="'Georgia',serif" font-size="13" fill="#a78bfa" opacity="0.7">✨ exploring</text>
  </g>

  <!-- Main text -->
  <text x="450" y="50" text-anchor="middle" font-family="'Georgia','PingFang SC',serif" font-size="20" font-weight="700" fill="#7c3aed" opacity="0.8">🌱 Tech Garden — Under Cultivation 🌱</text>
  <text x="450" y="165" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" fill="#a78bfa" opacity="0.6">每一段代码旅程，都从一颗种子开始</text>
</svg>